[project]
name = "pyaddict"
version = "2.0.0"
description = "yet another dict library"
readme = "README.md"
authors = [
    { name = "davidohnee", email = "dxstiny.gh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
lint = [
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ruff]
fix = true
lint.select = ["E", "F", "N", "B", "Q"]
